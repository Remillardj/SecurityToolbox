# BSOT Secret Scanning
name: Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install BSOT
        run: pip install -e .
      
      - name: Run secret scan
        id: scan
        run: |
          bsot file cred-scan . --json > scan-results.json || echo "SECRETS_FOUND=true" >> $GITHUB_OUTPUT
        continue-on-error: true
      
      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: secret-scan-results
          path: scan-results.json
      
      - name: Check for secrets
        if: steps.scan.outputs.SECRETS_FOUND == 'true'
        run: |
          echo "::error::Secrets detected!"
          cat scan-results.json
          exit 1
