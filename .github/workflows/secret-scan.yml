# BSOT Secret Scanning
name: Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install BSOT
        run: pip install -e .
      
      - name: Run secret scan
        # Fail on the exit code alone. Matched secrets must never reach the
        # public Actions log or an uploaded artifact: on a public repo those
        # copies outlive any history rewrite that scrubs the leak itself.
        run: |
          if ! bsot file cred-scan . --json > /dev/null 2>&1; then
            echo "::error::Secret scan found matches. Run 'bsot file cred-scan .' locally to see them."
            exit 1
          fi
